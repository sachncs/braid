name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/ruff-action@v1
        with: { args: "check --output-format=github" }
      - run: ruff format --check .

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      # mypy still flags upstream-library type aliases that look like Python 3.12
      # type statements; tracked separately. Kept || true until that's resolved.
      - run: mypy braid || true

  docstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      # pydocstyle has open complaints about the inherited numpy-convention
      # docstrings; tracked separately. Kept || true until that's resolved.
      - run: pydocstyle braid || true

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      - run: pytest -q -m conformance

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      - run: pytest -q -m integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      - run: pytest -q -m e2e

  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }}, cache: "pip" }
      - run: pip install -e ".[dev,serve]"
      - run: pytest -q
