      - alert: braid_braid_phase_phase1_step_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.phase.phase1.step[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_phase_phase2_step_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.phase.phase2.step[5m])) by (le)) > 200
        for: 5m
