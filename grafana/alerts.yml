groups:
  - name: braid
    rules:
      - alert: braid_braid_auth_apikey_failures_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.auth.apikey.failures[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_backbone_minicpm5_fwdlatency_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.backbone.minicpm5.fwdlatency[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_cache_lru_hits_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.cache.lru.hits[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_drift_pagehinkley_score_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.drift.pagehinkley.score[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_drift_psi_score_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.drift.psi.score[5m])) by (le)) > 200
        for: 5m
