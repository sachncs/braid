      - alert: braid_braid_server_openaicompat_qps_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.server.openaicompat.qps[5m])) by (le)) > 200
        for: 5m
        labels:
          severity: warning
      - alert: braid_braid_server_triton_qps_p95_high
        expr: histogram_quantile(0.95, sum(rate(braid.server.triton.qps[5m])) by (le)) > 200
        for: 5m
        labels:
