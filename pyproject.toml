[project]
name = "braid"
version = "0.1.0"
description = "Braiding signals into ranks. LLM-backed recommendation ranker with a polymorphic spine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "braid contributors" }]
keywords = ["recommender", "llm", "ranking", "polymorphic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "pydantic>=2.6",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=0.20",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pystache>=0.6",
  "datasets>=2.18",
  "tokenizers>=0.15",
  "tiktoken>=0.6",
  "sentencepiece>=0.2",
  "pandera>=0.18",
  "structlog>=24.1",
  "pydocstyle>=6.3",
  "hypothesis>=6.100",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.1",
  "pytest-xdist>=3.5",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "prometheus-client>=0.20",
]

[project.entry-points."braid.backbone"]
minicpm5 = "braid.backbone.minicpm5:minicpm5"
llama32 = "braid.backbone.llama32:llama32"
qwen25 = "braid.backbone.qwen25:qwen25"
pythia1 = "braid.backbone.pythia1:pythia1"

[project.entry-points."braid.catalogstore"]
matmulinmem = "braid.catalogstore.matmulinmem:matmulinmem"
matmulint4awq = "braid.catalogstore.matmulint4awq:matmulint4awq"
faissivfstore = "braid.catalogstore.faissivfstore:faissivfstore"
semanticids = "braid.catalogstore.semanticids:semanticids"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["braid"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101", "E501"]
"braid/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["braid", "tests"]

[tool.pytest.ini_options]
testpaths = ["braid", "tests"]
addopts = "-q --strict-markers"
markers = [
  "conformance: protocol contract suite",
  "integration: medium-scale tests",
  "e2e: end-to-end tests",
  "slow: long-running tests",
]

[tool.pydocstyle]
convention = "numpy"
add-select = ["D200", "D201", "D202", "D204", "D205", "D210", "D400", "D403"]
match-dir = "(?!_).*"

[tool.coverage.run]
source = ["braid"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
